name: Custom Windows AnyDesk Runner

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      ANYDESK_PASS: Pass@1234
      RUNTIME_MINUTES: 330

    steps:
      - name: Wipe Unnecessary Pre-Installed GitHub Apps & Shortcuts
        run: |
          Write-Host "Purging pre-installed desktop icons and non-essential software..."
          $publicDesktop = [Environment]::GetFolderPath("CommonDesktopDirectory")
          $userDesktop = "$env:USERPROFILE\Desktop"
          
          $targets = @("Unity Hub.lnk", "R 4.6.0.lnk", "Firefox.lnk", "Google Chrome.lnk", "Claim Rewards Here.lnk", "Visual Studio Community.lnk")
          foreach ($target in $targets) {
              if (Test-Path "$publicDesktop\$target") { Remove-Item "$publicDesktop\$target" -Force -ErrorAction SilentlyContinue }
              if (Test-Path "$userDesktop\$target") { Remove-Item "$userDesktop\$target" -Force -ErrorAction SilentlyContinue }
          }
          Write-Host "Desktop cleanup complete"

      - name: Download and Force Install AnyDesk
        run: |
          Write-Host "Starting AnyDesk installation process..."
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $dst = "$env:TEMP\AnyDesk.exe"
          
          Write-Host "Downloading AnyDesk..."
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $url -OutFile $dst -ErrorAction Stop
          
          $installDir = "C:\Program Files (x86)\AnyDesk"
          if (-not (Test-Path $installDir)) { New-Item -ItemType Directory -Path $installDir -Force | Out-Null }

          Write-Host "Installing AnyDesk to $installDir..."
          Start-Process $dst -ArgumentList "--install `"$installDir`"", "--silent", "--start-with-win" -Wait -NoNewWindow
          Start-Sleep -Seconds 10
          Remove-Item $dst -ErrorAction SilentlyContinue
          Write-Host "AnyDesk installation complete"

      - name: Start AnyDesk Service
        run: |
          Write-Host "Starting AnyDesk service..."
          Start-Service -Name AnyDesk -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 8
          
          $service = Get-Service -Name AnyDesk -ErrorAction SilentlyContinue
          if ($service) {
            Write-Host "AnyDesk Service Status: $($service.Status)"
          }

      - name: Configure Unattended Access Password & Force Enable Touch Injection
        run: |
          Write-Host "Configuring AnyDesk password and system settings..."
          
          $ad = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          if (-not (Test-Path $ad)) { $ad = "C:\Program Files\AnyDesk\AnyDesk.exe" }
          
          if (Test-Path $ad) {
            Write-Host "Found AnyDesk at: $ad"
            Write-Host "Setting password..."
            
            # Simple direct method - just set the password
            cmd.exe /c "echo Pass@1234 | `"$ad`" --set-password"
            
            Start-Sleep -Seconds 5
          } else {
            Write-Error "AnyDesk executable not found"
            exit 1
          }
          
          # Force Windows to allow UI Automation and Touch Injection over RDP layers
          Write-Host "Configuring registry for UI Automation..."
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "EnableUIADesktopToggle" -PropertyType DWord -Value 1 -Force -ErrorAction SilentlyContinue
          
          # Unblock Touch Remote/Tablet Mode restrictions in Remote Desktop Services
          $tsPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations"
          New-ItemProperty -Path $tsPath -Name "TouchMode" -PropertyType DWord -Value 1 -Force -ErrorAction SilentlyContinue
          New-ItemProperty -Path $tsPath -Name "EnableTouchInjection" -PropertyType DWord -Value 1 -Force -ErrorAction SilentlyContinue
          
          Write-Host "Configuring taskbar..."
          $path = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"
          Set-ItemProperty -Path $path -Name "TaskbarGlomLevel" -Value 0 -ErrorAction SilentlyContinue
          
          Write-Host "Restarting AnyDesk service..."
          Start-Process -FilePath $ad -ArgumentList "--restart-service" -Wait -NoNewWindow
          Start-Sleep -Seconds 10

      - name: Minimize Running Infrastructure Windows
        run: |
          Write-Host "Sending active command prompt windows to the taskbar tray..."
          $shell = New-Object -ComObject Shell.Application
          $shell.MinimizeAll()
          Start-Sleep -Seconds 2

      - name: Optimize Resolution for Mobile Display
        run: |
          Write-Host "Optimizing display resolution..."
          try {
            Set-DisplayResolution -Width 1600 -Height 1200 -Force -ErrorAction SilentlyContinue
            Write-Host "Resolution set to 1600x1200"
          } catch {
            Write-Host "Display resolution optimization skipped (module not available)"
          }

      - name: Download & Force Consumer Build of Opera GX
        run: |
          Write-Host "Fetching consumer-stable Opera GX Core..."
          $url = "https://net.geo.opera.com/opera_gx/stable/windows?utm_source=inf&utm_medium=gx"
          $installer = "$env:TEMP\OperaGXSetup.exe"
          
          Write-Host "Downloading Opera GX..."
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $url -OutFile $installer -ErrorAction SilentlyContinue
          
          if (Test-Path $installer) {
            Write-Host "Installing Opera GX..."
            Start-Process -FilePath $installer -ArgumentList "--silent=1", "--allusers=1", "--launchbrowser=0", "--desktopshortcut=1" -Wait -NoNewWindow
            Start-Sleep -Seconds 5
            
            $publicDesktop = [Environment]::GetFolderPath("CommonDesktopDirectory")
            $userDesktop = "$env:USERPROFILE\Desktop"
            
            if (Test-Path "$userDesktop\Opera GX.lnk") {
                Move-Item -Path "$userDesktop\Opera GX.lnk" -Destination $publicDesktop -Force -ErrorAction SilentlyContinue
            }
            
            Write-Host "Configuring Opera GX launcher shortcut..."
            $operaExe = "$env:ProgramFiles\Opera GX\opera.exe"
            if (-not (Test-Path $operaExe)) { $operaExe = "$env:ProgramFiles (x86)\Opera GX\opera.exe" }
            
            if (Test-Path $operaExe) {
              $WshShell = New-Object -ComObject WScript.Shell
              $Shortcut = $WshShell.CreateShortcut("$publicDesktop\Opera GX Browser.lnk")
              $Shortcut.TargetPath = $operaExe
              $Shortcut.Arguments = "https://www.opera.com/gx/forsaken --no-first-run --enable-features=GXRewards,GXRewardsSidebarItem --with-feature:gx-rewards=1"
              $Shortcut.Save()
              Write-Host "Opera GX shortcut created"
            }
          } else {
            Write-Host "WARNING: Opera GX download failed, continuing without it"
          }

      - name: Fetch and Display AnyDesk Connection Address
        run: |
          Write-Host "Retrieving AnyDesk connection details..."
          
          $confPath = "C:\ProgramData\AnyDesk\system.conf"
          $cleanId = ""
          
          # Try to get ID from config file with retry logic
          for ($i = 1; $i -le 20; $i++) {
              if (Test-Path $confPath) {
                  $content = Get-Content $confPath -Raw -ErrorAction SilentlyContinue
                  if ($content -match 'ad\.anynet\.id=(\d+)') {
                      $cleanId = $Matches[1]
                      Write-Host "AnyDesk ID found on attempt $i"
                      break
                  }
              }
              if ($i -lt 20) {
                Write-Host "Attempt $i/20 - Waiting for AnyDesk to initialize..."
                Start-Sleep -Seconds 3
              }
          }
          
          # If still no ID, try registry methods
          if (-not $cleanId) {
            Write-Host "Trying registry method..."
            $regPath = "HKLM:\SOFTWARE\AnyDesk\Client"
            if (Test-Path $regPath) {
              $id = Get-ItemProperty -Path $regPath -Name "AnyDeskId" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty AnyDeskId
              if ($id) { $cleanId = $id }
            }
          }
          
          if (-not $cleanId) {
            $regPath2 = "HKLM:\SOFTWARE\WOW6432Node\AnyDesk\Client"
            if (Test-Path $regPath2) {
              $id = Get-ItemProperty -Path $regPath2 -Name "AnyDeskId" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty AnyDeskId
              if ($id) { $cleanId = $id }
            }
          }
          
          $ESC = [char]27
          $Green = "$ESC[32m"
          $Yellow = "$ESC[33m"
          $Red = "$ESC[31m"
          $Reset = "$ESC[0m"
          
          Write-Host ""
          Write-Host "${Green}====================================================${Reset}"
          Write-Host "${Green}       ANYDESK CLOUD MACHINE IS READY TO CONNECT     ${Reset}"
          Write-Host "${Green}====================================================${Reset}"
          Write-Host "${Yellow} CONNECTION ID : ${Red}${cleanId}${Reset}"
          Write-Host "${Yellow} PASSWORD      : ${Red}Pass@1234${Reset}"
          Write-Host "${Green}====================================================${Reset}"
          Write-Host ""
          
          if (-not $cleanId) {
            Write-Host "${Red}WARNING: Could not retrieve AnyDesk ID, but service is running${Reset}"
          }

      - name: Verify AnyDesk is Running
        run: |
          Write-Host "Verifying AnyDesk status..."
          Write-Host ""
          
          $processes = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
          if ($processes) {
            Write-Host "AnyDesk Process(es) Running:"
            $processes | Format-Table -Property Id, Name, @{Label="Memory (MB)"; Expression={[math]::Round($_.Memory/1MB, 2)}} -AutoSize
          } else {
            Write-Host "WARNING: No AnyDesk process found - attempting to start..."
            Start-Service -Name AnyDesk -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
          }
          
          Write-Host ""
          $service = Get-Service -Name "AnyDesk" -ErrorAction SilentlyContinue
          if ($service) {
            Write-Host "AnyDesk Service Status: $($service.Status)"
          }
          
          Write-Host ""

      - name: Keep alive
        run: |
          $mins = [int]"${{ env.RUNTIME_MINUTES }}"
          $end = (Get-Date).AddMinutes($mins)
          $checkInterval = 60  # Check every 60 seconds
          
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "Runner is ONLINE and ready for remote connections"
          Write-Host "Maximum Runtime: $mins minutes"
          Write-Host "======================================================"
          Write-Host ""
          
          $checkCounter = 0
          
          while ((Get-Date) -lt $end) {
            $now = Get-Date
            $remaining = $end - $now
            
            Write-Host ("Cloud PC Heartbeat " + $now.ToString("HH:mm:ss") + " | Active until " + $end.ToString("HH:mm:ss") + " | Remaining: $($remaining.Hours)h $($remaining.Minutes)m")
            
            # Every 5 minutes, verify AnyDesk is still running
            $checkCounter++
            if ($checkCounter -ge 5) {
              $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              if (-not $process) {
                Write-Host "WARNING: AnyDesk process died, restarting service..."
                Start-Service -Name AnyDesk -ErrorAction SilentlyContinue
                Start-Sleep -Seconds 5
              }
              $checkCounter = 0
            }
            
            Start-Sleep -Seconds $checkInterval
          }
          
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "Maximum runtime reached - Session ending"
          Write-Host "======================================================"
